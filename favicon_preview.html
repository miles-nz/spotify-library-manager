<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { display: flex; gap: 48px; align-items: flex-end; font-family: sans-serif; background: #ddd; padding: 24px; }
  figure { margin: 0; text-align: center; }
  img { display: block; background: #fff; }
  figcaption { margin-top: 8px; font-size: 12px; color: #333; }
</style>
</head>
<body>
  <figure>
    <img src="static/favicon.svg" width="128" height="128">
    <figcaption>app icon (128px)</figcaption>
  </figure>
  <figure>
    <img src="static/favicon.svg" width="32" height="32">
    <figcaption>favicon (32px)</figcaption>
  </figure>
  <figure>
    <img src="static/favicon.svg" width="16" height="16">
    <figcaption>favicon (16px)</figcaption>
  </figure>
</body>
</html>
