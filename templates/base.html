<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Spotify Library Manager{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; }
    a.button, button.button {
      font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 6px; border: none;
      background: #1db954; color: white; cursor: pointer; text-decoration: none;
      display: inline-block; margin-right: 0.5rem;
    }
    a.button.secondary, button.button.secondary { background: #eee; color: #333; }
    button.button:disabled { cursor: default; opacity: 0.6; }
    .warning { color: #b45309; }
    .hint { color: #666; }
    .nav { margin-bottom: 1.5rem; }
    .nav a { color: #666; text-decoration: none; font-size: 0.9rem; }
    .nav a:hover { text-decoration: underline; }
    .spinner {
      display: inline-block; width: 1em; height: 1em; border: 2px solid #ccc;
      border-top-color: #1db954; border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: -0.15em; margin-right: 0.5em;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  {% block nav %}<p class="nav"><a href="{{ url_for('home') }}">← Home</a></p>{% endblock %}
  {% block content %}{% endblock %}
</body>
</html>
